name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [mesh_protocol, geo_utils]
    defaults:
      run:
        working-directory: packages/${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Siapkan proyek
        run: ./tools/bootstrap.sh
      - run: cd app && flutter analyze
      - run: cd app && flutter test

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 data_pipeline/scripts/validate_trails.py data_pipeline/packs/contoh_gunung/trails.geojson data_pipeline/packs/contoh_gunung/poi.geojson
