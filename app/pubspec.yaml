name: nama_app
description: Aplikasi pendampingan pendakian - tracking, peta offline, grup, SOS.
publish_to: none
version: 0.1.0+2

environment:
  sdk: ^3.3.0

# Dependensi minimal agar proyek langsung bisa dibangun.
# Sisanya (lokasi, peta, database, dst.) dipasang oleh tools/add_dependencies.sh
# agar versinya otomatis yang terbaru dan kompatibel.
dependencies:
  battery_plus: ^7.1.2
  camera: ^0.12.2
  connectivity_plus: ^7.3.1
  cryptography: ^2.9.0
  device_info_plus: ^13.3.0
  drift: ^2.35.3
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  flutter:
    sdk: flutter
  flutter_compass: ^0.8.1
  flutter_foreground_task: ^11.0.3
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.3
  flutter_secure_storage: ^11.2.0
  geo_utils:
    path: ../packages/geo_utils
  geolocator: ^14.1.2
  go_router: ^18.1.1
  google_sign_in: ^6.2.2
  gpx: ^2.3.0
  http: ^1.2.2
  image_picker: ^1.2.4
  just_audio: ^0.10.6
  mapbox_maps_flutter: ^3.33.0
  mesh_protocol:
    path: ../packages/mesh_protocol
  path: ^1.9.1
  path_provider: ^2.1.6
  pedometer: ^4.2.0
  permission_handler: ^13.0.2
  record: ^7.1.2
  sensors_plus: ^7.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqlite3_flutter_libs: ^0.6.0+eol
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  video_player: ^2.14.1

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/hiqeo_launcher_ios.png"
  image_path_android: "assets/brand/hiqeo_launcher_ios.png"
  image_path_ios: "assets/brand/hiqeo_launcher_ios.png"
  adaptive_icon_background: "#242B40"
  adaptive_icon_foreground: "assets/brand/hiqeo_launcher_foreground.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/audio/
    - assets/map_packs/
    - assets/brand/
    - assets/gpx/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
  # Aktifkan setelah menambahkan flutter_localizations + intl:
  # generate: true

# jni 1.2.0 menghapus penyesuaian nama kelas "Lpkg/Cls;" -> "pkg/Cls", padahal binding
# path_provider_android 2.3.1 (jnigen 0.16) masih bergantung padanya, sehingga setiap
# getApplicationSupportDirectory() gagal dengan ClassNotFoundException. Hapus override
# ini saat path_provider_android dirilis ulang dengan jnigen >= 1.0.
dependency_overrides:
  jni: '>=1.1.2 <1.2.0'
  jni_flutter: '>=1.0.4 <1.1.0'