name: nama_app
description: Aplikasi pendampingan pendakian - tracking, peta offline, grup, SOS.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.3.0

# Dependensi minimal agar proyek langsung bisa dibangun.
# Sisanya (lokasi, peta, database, dst.) dipasang oleh tools/add_dependencies.sh
# agar versinya otomatis yang terbaru dan kompatibel.
dependencies:
  battery_plus: ^7.1.2
  connectivity_plus: ^7.3.1
  cryptography: ^2.9.0
  drift: ^2.35.3
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.14
  flutter_compass: ^0.8.1
  flutter_foreground_task: ^11.0.3
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.3
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geo_utils:
    path: ../packages/geo_utils
  geolocator: ^14.1.2
  go_router: ^18.1.1
  image_picker: ^1.2.4
  just_audio: ^0.10.6
  mapbox_maps_flutter: ^3.33.0
  mesh_protocol:
    path: ../packages/mesh_protocol
  path: ^1.9.1
  path_provider: ^2.1.6
  pedometer: ^4.2.0
  permission_handler: ^13.0.2
  record: ^7.1.2
  sensors_plus: ^7.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqlite3_flutter_libs: ^0.6.0+eol
  supabase_flutter: ^2.18.3

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/map_packs/
  # Aktifkan setelah menambahkan flutter_localizations + intl:
  # generate: true
